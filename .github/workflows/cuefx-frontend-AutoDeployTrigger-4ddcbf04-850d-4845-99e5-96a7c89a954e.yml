name: Trigger auto deployment for cuefx-frontend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'CueFX-frontend/**'
    - '.github/workflows/cuefx-frontend-AutoDeployTrigger-4ddcbf04-850d-4845-99e5-96a7c89a954e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CUEFXFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CUEFXFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CUEFXFRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/CueFX-frontend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: cuefx.azurecr.io
          registryUsername: ${{ secrets.CUEFXFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CUEFXFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: cuefx-frontend
          resourceGroup: vestra-path-rg
          imageToBuild: cuefx.azurecr.io/cuefx-frontend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_

